<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Ahh Things</title>
<style>
  * { box-sizing: border-box; }
  body { font: 16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; margin: 0; background: #f6f6f8; color: #111; }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.5px; }
  .sub { color: #777; margin-top: 4px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 14px; padding: 12px; display: flex; flex-direction: column;
          box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.04); }
  .card img, .card .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #eee; }
  .card h3 { margin: 10px 0 4px; font-size: 16px; }
  .card p { margin: 0 0 10px; color: #666; font-size: 14px; flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .price { font-weight: 700; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 9px; background: #111; color: #fff; cursor: pointer; }
  button.ghost { background: #eee; color: #111; }
  button:disabled { opacity: .4; cursor: default; }
  #cartBtn { position: fixed; right: 20px; top: 20px; background: #111; color: #fff; padding: 10px 16px;
             border-radius: 999px; cursor: pointer; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.2); border: 0; }
  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 500px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  input, select { width: 100%; padding: 9px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
  .cartline { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
  .total { text-align: right; font-weight: 700; margin-top: 10px; font-size: 17px; }
  .ok { text-align: center; padding: 12px; }
  .ok .ref { font-size: 32px; font-weight: 800; letter-spacing: 3px; margin: 10px 0; }
  .empty { color: #999; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<button id="cartBtn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
<header>
  <h1>Random Ahh Things</h1>
  <div class="sub">3D-printed stuff, made at school. Cash on collection.</div>
</header>
<div class="wrap">
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
</div>

<dialog id="cartDlg">
  <h2 style="margin-top:0">Your order</h2>
  <div id="cartLines"></div>
  <div class="total" id="cartTotal"></div>
  <button class="ghost" style="margin-top:12px" onclick="cart=[];saveCart()">Clear</button>
  <label>Your name</label>
  <input id="fName" placeholder="First name + initial">
  <label>Date you want it (must be 2+ days away)</label>
  <input id="fDate" type="date">
  <label>Where in school</label>
  <input id="fLoc" list="locs" placeholder="e.g. library desk 3">
  <datalist id="locs">
    <option value="Library"><option value="Front office"><option value="Canteen"><option value="Sports hall">
  </datalist>
  <label>When you'll pay &amp; collect</label>
  <select id="fSlot">
    <option value="break">Break</option>
    <option value="lunch">Lunch</option>
    <option value="after-school">After school</option>
  </select>
  <div style="display:flex;gap:10px;margin-top:16px">
    <button style="flex:1" onclick="submitOrder(event)">Place order</button>
    <button class="ghost" onclick="document.getElementById('cartDlg').close()">Close</button>
  </div>
</dialog>

<script>
// ⚠️ EDIT THIS to your zrok URL (no trailing slash):
const API = 'https://randomahhthings.share.zrok.io';

let products = [];
let cart = JSON.parse(localStorage.getItem('rat_cart') || '[]');

const money = p => '£' + (p/100).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  try {
    const r = await fetch(API + '/products');
    products = await r.json();
  } catch (e) { products = []; }
  document.getElementById('grid').innerHTML = products.map(p => `
    <div class="card">
      ${p.imageUrl ? `<img src="${API}${p.imageUrl}" alt="">` : '<div class="noimg"></div>'}
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.description || '')}</p>
      <div class="row">
        <span class="price">${money(p.price)}</span>
        <button onclick="add('${p.id}')">Add</button>
      </div>
    </div>`).join('') || '<div class="empty">No products yet — check back soon.</div>';
  renderCart();
}

function add(id) {
  const line = cart.find(l => l.productId === id);
  if (line) line.qty = Math.min(10, line.qty + 1);
  else cart.push({ productId: id, qty: 1 });
  saveCart();
}
function inc(i) { cart[i].qty = Math.min(10, cart[i].qty + 1); saveCart(); }
function dec(i) { cart[i].qty--; if (cart[i].qty <= 0) cart.splice(i,1); saveCart(); }
function saveCart() { localStorage.setItem('rat_cart', JSON.stringify(cart)); renderCart(); }

function renderCart() {
  document.getElementById('cartCount').textContent = cart.reduce((s,l)=>s+l.qty, 0);
  const box = document.getElementById('cartLines');
  if (!cart.length) {
    box.innerHTML = '<div class="empty">Cart is empty</div>';
    document.getElementById('cartTotal').textContent = '';
    return;
  }
  let total = 0;
  box.innerHTML = cart.map((l, i) => {
    const p = products.find(x => x.id === l.productId);
    if (!p) return '';
    total += p.price * l.qty;
    return `<div class="cartline">
      <span>${esc(p.name)}</span>
      <span style="display:flex;gap:6px;align-items:center">
        <button class="ghost" onclick="dec(${i})">−</button>
        <span style="min-width:18px;text-align:center">${l.qty}</span>
        <button class="ghost" onclick="inc(${i})">+</button>
        <span style="min-width:52px;text-align:right">${money(p.price*l.qty)}</span>
      </span>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').textContent = 'Total ' + money(total);
}

function openCart() {
  if (!cart.length) return alert('Your cart is empty');
  const d = new Date(); d.setDate(d.getDate() + 2);
  const inp = document.getElementById('fDate');
  inp.min = d.toISOString().slice(0,10);
  if (!inp.value || inp.value < inp.min) inp.value = inp.min;
  renderCart();
  document.getElementById('cartDlg').showModal();
}

async function submitOrder(ev) {
  const name = document.getElementById('fName').value.trim();
  const date = document.getElementById('fDate').value;
  const location = document.getElementById('fLoc').value.trim();
  const payTime = document.getElementById('fSlot').value;
  if (!cart.length) return alert('Cart is empty');
  if (!name) return alert('Enter your name');
  if (!location) return alert('Where in school?');

  const btn = ev.target; btn.disabled = true; btn.textContent = 'Placing…';
  try {
    const r = await fetch(API + '/orders', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name, date, location, payTime, items: cart }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'failed');
    cart = []; localStorage.removeItem('rat_cart');
    document.getElementById('cartDlg').innerHTML = `
      <div class="ok">
        <h2>Order placed 🎉</h2>
        <div class="ref">${data.ref}</div>
        <p>Show this ref when you pay. Total: <b>${money(data.total)}</b></p>
        <p style="color:#666">Bring cash at your chosen time.</p>
        <button onclick="location.reload()" style="margin-top:10px">Done</button>
      </div>`;
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Place order';
  }
}

load();
</script>
</body>
</html>
